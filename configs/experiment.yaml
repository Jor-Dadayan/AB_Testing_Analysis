seed: 42
n_users: 100000          # можно поставить 1000000, код векторизован
scenario: positive       # positive | no_effect | negative
start_date: "2025-01-06" # понедельник
n_days: 28
treatment_share: 0.5
baseline_conversion: 0.10

scenarios:
  positive:  {conversion_delta: 0.01,  aov_multiplier: 1.02}
  no_effect: {conversion_delta: 0.0,   aov_multiplier: 1.00}
  negative:  {conversion_delta: -0.01, aov_multiplier: 0.98}

paths:
  raw_csv: data/raw/users.csv
  truth: data/simulation/truth.json

analysis:
  alpha: 0.05                          # допустимая вероятность ошибки I рода
  power: 0.80                          # целевая мощность (1 - вероятность ошибки II рода)
  planned_mde_abs: 0.01                # на какой прирост конверсии тест СПРОЕКТИРОВАН (+1 п.п.)
  practical_threshold_abs: 0.005       # минимальный прирост конверсии, который окупает внедрение
  practical_threshold_arpu_rel: 0.03   # минимальный относительный прирост ARPU (3%)
  srm_alpha: 0.001                     # порог проверки соотношения групп
  n_bootstrap: 2000
  bootstrap_seed: 2024

advanced:
  n_bootstrap_conversion: 10000      # для долей bootstrap дешёвый, можно больше
  srm_segment_alpha: 0.01            # семейный порог SRM по сегментам (делится по Bonferroni)
  segment_dimensions: [device_type, country, traffic_source, age_group, is_new_user]
  segment_min_users: 500             # минимум пользователей в КАЖДОЙ группе сегмента
  fdr_q: 0.05                        # допустимая доля ложных находок среди находок (BH)
  winsor_percentiles: [0.99, 0.999]  # потолки чеков для проверки влияния выбросов
  guardrail_alpha: 0.05              # односторонний уровень для теста "не хуже"
  balance_smd_warn: 0.10
  balance_smd_critical: 0.25
  min_duration_days: 14              # не меньше двух полных недель
  stability_alpha: 0.05
  success_criteria:                  # заданы ДО просмотра результатов
    require_sensitivity_robust: true
    block_on_confirmed_segment_harm: true
  guardrails:
    - {name: arpu, label: "Выручка на пользователя (ARPU)", column: revenue, kind: mean, population: all, direction: higher_is_better, margin_rel: 0.05, required: true}
    - {name: aov, label: "Средний чек покупателей (AOV)", column: revenue, kind: mean, population: payers, direction: higher_is_better, margin_rel: 0.05, required: true}
    - {name: refund_rate, label: "Доля возвратов", column: refunded, kind: proportion, population: payers, direction: lower_is_better, margin_abs: 0.02, required: false}
    - {name: checkout_abandonment, label: "Отказ от оформления заказа", column: checkout_abandoned, kind: proportion, population: all, direction: lower_is_better, margin_abs: 0.02, required: false}

dashboard:
  min_group_users: 1000              # меньше пользователей в группе подвыборки: анализ не запускается
  filtered_n_bootstrap: 500          # облегчённый bootstrap для интерактивных подвыборок
  filtered_n_bootstrap_conversion: 5000

experiments:
  - {id: primary, label: "Checkout v2: основной эксперимент", source: primary}
  - {id: demo_1, label: "Демо-эксперимент 1", source: csv, path: data/experiments/demo_1.csv}
  - {id: demo_2, label: "Демо-эксперимент 2", source: csv, path: data/experiments/demo_2.csv}
  - {id: demo_3, label: "Демо-эксперимент 3", source: csv, path: data/experiments/demo_3.csv}
