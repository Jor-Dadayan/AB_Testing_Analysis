[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentlab"
version = "0.1.0"
description = "End-to-End A/B Testing & Experimentation Analytics Platform"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "plotly",
    "sqlalchemy",
    "psycopg2-binary",
    "pyyaml",
    "python-dotenv",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "jupyter", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: полный анализ на 100 000 пользователей (десятки секунд)",
    "integration: нужен PostgreSQL (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "S", "T20", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607", "S608"]
"scripts/*" = ["T201"]
"src/experimentlab/check_report.py" = ["T201"]
"src/experimentlab/db/checks.py" = ["S608"]  # имена таблиц берутся из константы TABLES
"src/experimentlab/analysis/report.py" = ["N806"]
"src/experimentlab/analysis/advanced_report.py" = ["N806"]
# Границы приложения: любая ошибка превращается в сообщение (с логированием)
"src/experimentlab/app/services.py" = ["BLE001"]
"src/experimentlab/app/components.py" = ["BLE001"]
"src/experimentlab/db/loader.py" = ["BLE001"]
